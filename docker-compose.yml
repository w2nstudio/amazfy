# Local development services. Start: docker compose up -d   Stop: docker compose down
services:
  postgres:
    image: postgres:18-alpine
    container_name: amazfy-postgres
    environment:
      POSTGRES_DB: amazfy
      POSTGRES_USER: amazfy
      POSTGRES_PASSWORD: amazfy # local development only; real environments use secrets
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazfy -d amazfy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake email server: catches every email the backend sends, so nothing reaches real inboxes.
  # Read the emails in the web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: amazfy-mailpit
    ports:
      - "1025:1025" # SMTP: the backend sends emails here
      - "8025:8025" # web UI

  # Database browser: view tables and run SQL in the web UI at http://localhost:5050
  # Runs in desktop mode (no pgAdmin login). The amazfy server is pre-registered;
  # the first time you open it, enter password "amazfy" and tick "Save password".
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: amazfy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@amazfy.dev
      PGADMIN_DEFAULT_PASSWORD: amazfy # local development only
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "amazfy (local)",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "amazfy",
            "Username": "amazfy",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  postgres-data:
  pgadmin-data:
