openapi: 3.1.0
info:
  title: Amazfy API
  version: 1.0.0
  description: |
    Contract for the Amazfy backend. Written first, then the Kotlin server interfaces
    and the TypeScript client are generated from it. Never hand-edit generated code.

    Authentication: send the access token as `Authorization: Bearer <token>`.
    The refresh token travels only in the `amazfy_refresh` cookie (HttpOnly, Secure, SameSite=Strict).
    Errors use RFC 7807 problem details (`application/problem+json`).

servers:
  - url: http://localhost:8080
    description: Local development

# Every operation requires a bearer token unless it overrides this with `security: []`
security:
  - bearerAuth: []

tags:
  - name: System
    description: Information about the running service
  - name: Auth
    description: Sign-up, login, tokens, email verification, password reset, Google login
  - name: Me
    description: The logged-in user
  - name: Accounts
    description: Seller accounts (one per Amazon seller account) and the user's access to them
  - name: Brands
    description: The seller's brands (registered in Amazon Brand Registry). Every product belongs to one.
  - name: Products
    description: Amazon listings, each identified by ASIN + marketplace, linked to a brand

paths:
  /api/v1/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Name and version of the running backend
      security: []
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"

  # ---------- Auth ----------

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Sign up with email and password; creates the user, their first account and an owner membership
      description: Sends a verification email. The user is logged in immediately (see AuthTokens).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and logged in; the refresh token is set as a cookie
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with this email already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the refresh token is set as a cookie
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Wrong email or password (the response never says which)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Get a new access token using the refresh cookie; the refresh token is rotated
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieParam"
      responses:
        "200":
          description: New tokens; a new refresh cookie replaces the old one
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out this browser; revokes the refresh token and clears the cookie
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieParam"
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Log out everywhere; revokes all of the user's refresh tokens
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address with the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Email verified
        "400":
          description: Token invalid, expired or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send the verification email again to the logged-in user
      responses:
        "204":
          description: Sent (or already verified)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      description: Always returns 202, whether or not the email exists, so the endpoint can't be used to find out who has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: If the email belongs to a user, a reset email is on its way
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the token from the reset email; logs out all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Token invalid, expired or already used, or the new password breaks the rules
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Start "Sign in with Google" (browser navigation, not a fetch call)
      security: []
      responses:
        "302":
          description: Redirect to Google's consent page

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleLogin
      summary: Google redirects here after consent; Amazfy logs the user in and redirects to the frontend
      description: |
        Sets the refresh cookie and redirects to the frontend. The frontend then calls /auth/refresh to get an access token.
        A first-time Google user has no account yet and is redirected to the onboarding step that asks for the account name.
      security: []
      parameters:
        - name: code
          in: query
          description: One-time code from Google. Missing when the user cancelled or sign-in failed (then `error` is set).
          required: false
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of `code`, e.g. `access_denied` when the user pressed Cancel.
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend (home, or onboarding for a new user, or the login page with an error)
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  # ---------- Me ----------

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The logged-in user and the accounts they can access
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------- Accounts ----------

  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account; the caller becomes its owner
      description: Used by "Add account" and by onboarding after a first Google sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account (requires membership)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Accounts]
      operationId: renameAccount
      summary: Rename an account (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Account renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------- Catalog (account-scoped: any member may read, owners and editors may change) ----------

  /api/v1/accounts/{accountId}/brands:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Brands]
      operationId: listBrands
      summary: The account's brands, sorted by name
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Brands]
      operationId: createBrand
      summary: Add a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/brands/{brandId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/BrandId"
    patch:
      tags: [Brands]
      operationId: renameBrand
      summary: Rename a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "200":
          description: Brand renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Brands]
      operationId: deleteBrand
      summary: Remove a brand that has no products
      description: A brand with products can't be removed (409); move or remove its products first, so no product is ever left without a brand.
      responses:
        "204":
          description: Brand removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/products:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Products]
      operationId: listProducts
      summary: The account's products, sorted by brand, then name
      parameters:
        - name: brandId
          in: query
          required: false
          description: Only this brand's products
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Add a product (an Amazon listing) to a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Rename a product or move it to another brand
      description: ASIN and marketplace can't change; they identify the listing. To track a different listing, add a new product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Remove a product
      responses:
        "204":
          description: Product removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookieParam:
      name: amazfy_refresh
      in: cookie
      required: false
      schema:
        type: string

  headers:
    RefreshCookie:
      description: "amazfy_refresh=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth (cleared on logout)"
      schema:
        type: string

  responses:
    ValidationError:
      description: The request is invalid; `detail` and `errors` explain what to fix
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Logged in, but no access to this account or not allowed for this role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such brand or product in this account
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Clashes with existing data, e.g. the same ASIN + marketplace already exists, or the brand still has products
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; try again later
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    SystemInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: amazfy-backend
        version:
          type: string
          example: 0.0.1-SNAPSHOT

    Problem:
      description: RFC 7807 problem details
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Password must be at least 10 characters.
        instance:
          type: string
          example: /api/v1/auth/register
        errors:
          description: Field-level validation errors, when there are any
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: must be at least 10 characters

    RegisterRequest:
      type: object
      required: [email, password, accountName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: john@aqualife.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        accountName:
          type: string
          minLength: 1
          maxLength: 100
          example: AquaLife US

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 128

    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 200
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 128

    AuthTokens:
      description: The access token; the refresh token is only in the cookie, never in JSON
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          description: Seconds until the access token expires
          type: integer
          example: 900

    Role:
      type: string
      enum: [OWNER, EDITOR, VIEWER]

    Me:
      type: object
      required: [id, email, emailVerified, accounts]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        accounts:
          description: Accounts the user can access, with their role in each. Empty for a new Google user before onboarding.
          type: array
          items:
            $ref: "#/components/schemas/AccountAccess"

    AccountAccess:
      type: object
      required: [account, role]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        role:
          $ref: "#/components/schemas/Role"

    AccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: AquaLife US

    Account:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: AquaLife US
        createdAt:
          type: string
          format: date-time

    Marketplace:
      description: |
        An Amazon country site. Phase 1 supports the marketplaces where Amazon Attribution is available.
        Codes as Amazon uses them (UK, not GB): US amazon.com, CA amazon.ca, UK amazon.co.uk, DE amazon.de,
        FR amazon.fr, IT amazon.it, ES amazon.es.
      type: string
      enum: [US, CA, UK, DE, FR, IT, ES]

    BrandRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the account, ignoring upper/lower case
          example: AquaLife

    Brand:
      type: object
      required: [id, name, productCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: AquaLife
        productCount:
          type: integer
          description: How many products the brand has (a brand with products can't be removed)
        createdAt:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [brandId, asin, marketplace, name]
      properties:
        brandId:
          type: string
          format: uuid
        asin:
          type: string
          maxLength: 20
          description: |
            Amazon's 10-character product id, e.g. B0AAA11111 (from the listing's address: amazon.com/dp/B0AAA11111).
            Spaces are trimmed and letters upper-cased; then it must be "B0" plus 8 letters or digits.
            Unique together with the marketplace within the account (409 otherwise).
          example: B0AAA11111
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A short name the seller recognises, e.g. "Aquarium filter 40L"
          example: Aquarium filter 40L

    ProductUpdateRequest:
      type: object
      description: Only the fields that are sent change
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200

    Product:
      type: object
      required: [id, brandId, asin, marketplace, name, amazonUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        asin:
          type: string
          example: B0AAA11111
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        name:
          type: string
          example: Aquarium filter 40L
        amazonUrl:
          type: string
          format: uri
          description: The listing on Amazon, e.g. https://www.amazon.com/dp/B0AAA11111
        createdAt:
          type: string
          format: date-time
