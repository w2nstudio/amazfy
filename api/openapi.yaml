openapi: 3.1.0
info:
  title: Amazfy API
  version: 1.0.0
  description: |
    Contract for the Amazfy backend. Written first, then the Kotlin server interfaces
    and the TypeScript client are generated from it. Never hand-edit generated code.

    Authentication: send the access token as `Authorization: Bearer <token>`.
    The refresh token travels only in the `amazfy_refresh` cookie (HttpOnly, Secure, SameSite=Strict).
    Errors use RFC 7807 problem details (`application/problem+json`).

servers:
  - url: http://localhost:8080
    description: Local development

# Every operation requires a bearer token unless it overrides this with `security: []`
security:
  - bearerAuth: []

tags:
  - name: System
    description: Information about the running service
  - name: Auth
    description: Sign-up, login, tokens, email verification, password reset, Google login
  - name: Me
    description: The logged-in user
  - name: Accounts
    description: Seller accounts (one per Amazon seller account) and the user's access to them
  - name: Brands
    description: The seller's brands (registered in Amazon Brand Registry). Every product belongs to one.
  - name: Products
    description: Amazon listings, each identified by ASIN + marketplace, linked to a brand
  - name: Reports
    description: What the seller's ads cost and what they brought on Amazon (ROAS and more), for a date range
  - name: Development
    description: Helpers for local development only. Production servers don't have them (404).

paths:
  /api/v1/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Name and version of the running backend
      security: []
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"

  # ---------- Auth ----------

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Sign up with email and password; creates the user, their first account and an owner membership
      description: Sends a verification email. The user is logged in immediately (see AuthTokens).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and logged in; the refresh token is set as a cookie
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with this email already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the refresh token is set as a cookie
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Wrong email or password (the response never says which)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Get a new access token using the refresh cookie; the refresh token is rotated
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieParam"
      responses:
        "200":
          description: New tokens; a new refresh cookie replaces the old one
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out this browser; revokes the refresh token and clears the cookie
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieParam"
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Log out everywhere; revokes all of the user's refresh tokens
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address with the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Email verified
        "400":
          description: Token invalid, expired or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send the verification email again to the logged-in user
      responses:
        "204":
          description: Sent (or already verified)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      description: Always returns 202, whether or not the email exists, so the endpoint can't be used to find out who has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: If the email belongs to a user, a reset email is on its way
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the token from the reset email; logs out all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Token invalid, expired or already used, or the new password breaks the rules
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Start "Sign in with Google" (browser navigation, not a fetch call)
      security: []
      responses:
        "302":
          description: Redirect to Google's consent page

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleLogin
      summary: Google redirects here after consent; Amazfy logs the user in and redirects to the frontend
      description: |
        Sets the refresh cookie and redirects to the frontend. The frontend then calls /auth/refresh to get an access token.
        A first-time Google user has no account yet and is redirected to the onboarding step that asks for the account name.
      security: []
      parameters:
        - name: code
          in: query
          description: One-time code from Google. Missing when the user cancelled or sign-in failed (then `error` is set).
          required: false
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of `code`, e.g. `access_denied` when the user pressed Cancel.
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend (home, or onboarding for a new user, or the login page with an error)
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  # ---------- Me ----------

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The logged-in user and the accounts they can access
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------- Accounts ----------

  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account; the caller becomes its owner
      description: Used by "Add account" and by onboarding after a first Google sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account (requires membership)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Accounts]
      operationId: renameAccount
      summary: Rename an account (owner only)
      description: Only the name changes; the region is fixed, like the Amazon seller account's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Account renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------- Catalog (account-scoped: any member may read, owners and editors may change) ----------

  /api/v1/accounts/{accountId}/brands:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Brands]
      operationId: listBrands
      summary: The account's brands, sorted by name
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Brands]
      operationId: createBrand
      summary: Add a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/brands/{brandId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/BrandId"
    patch:
      tags: [Brands]
      operationId: renameBrand
      summary: Rename a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandRequest"
      responses:
        "200":
          description: Brand renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Brands]
      operationId: deleteBrand
      summary: Remove a brand that has no products
      description: A brand with products can't be removed (409); move or remove its products first, so no product is ever left without a brand.
      responses:
        "204":
          description: Brand removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/products:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Products]
      operationId: listProducts
      summary: The account's products, sorted by brand, then name
      parameters:
        - name: brandId
          in: query
          required: false
          description: Only this brand's products
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Add a product (an Amazon listing) to a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/accounts/{accountId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Rename a product or move it to another brand
      description: ASIN and marketplace can't change; they identify the listing. To track a different listing, add a new product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Remove a product
      responses:
        "204":
          description: Product removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------- Reports ----------

  /api/v1/accounts/{accountId}/reports/summary:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: Totals for a date range, per currency
      description: |
        Google spend and Amazon Attribution numbers of the whole seller account (all its ads, including Brand Store
        and unmatched ones) added up over the days from..to, both included. Without dates: the last 30 days up to
        yesterday (Amazon has no numbers for today yet). Amounts are never added up across currencies, so there is
        one entry per currency; a seller account in Europe can have GBP and EUR.
        At most 366 days; from must not be after to (400 otherwise).
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/accounts/{accountId}/reports/breakdown:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Reports]
      operationId: getReportBreakdown
      summary: The same totals split into rows by brand, product, campaign, ad group or ad (drill-down)
      description: |
        One row per brand, product, campaign, ad group or ad (`by`) and currency, with the numbers of the ads in it.
        The filters narrow which ads count, which is how the drill-down works: a row's kind and id become the filter
        for the next level, e.g. the product row → `by=campaign&productId=…` shows that product's campaigns with only
        that product's ads counted.
        Special rows keep the totals complete, so all rows of a level add up to the summary:
        BRAND_LEVEL (Brand Store ads of a brand, at product level; drill with brandId + brandLevel=true),
        NOT_LINKED (ads not linked to a product or brand; drill with notLinked=true) and
        UNMATCHED (Attribution numbers matching no known ad; only without filters, no drill-down).
        Only rows with spend or Attribution numbers in the range appear. Dates as in the summary.
      parameters:
        - name: by
          in: query
          required: true
          description: What each row stands for
          schema:
            $ref: "#/components/schemas/BreakdownLevel"
        - $ref: "#/components/parameters/FilterBrandId"
        - $ref: "#/components/parameters/FilterProductId"
        - $ref: "#/components/parameters/FilterBrandLevel"
        - $ref: "#/components/parameters/FilterNotLinked"
        - $ref: "#/components/parameters/FilterCampaignId"
        - $ref: "#/components/parameters/FilterAdGroupId"
        - $ref: "#/components/parameters/FilterAdId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportBreakdown"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/accounts/{accountId}/reports/trend:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Reports]
      operationId: getReportTrend
      summary: The totals per day, for a chart (whole account or one drill-down row)
      description: |
        Spend, sales and the other totals for each day of the range, one series per currency. Every day is in the
        series, with zeros on days without numbers. The filters are the drill-down's, so the chart follows the row the
        seller picked; without filters it covers the whole seller account (including UNMATCHED numbers) and the days
        add up to the summary. Dates as in the summary.
      parameters:
        - $ref: "#/components/parameters/FilterBrandId"
        - $ref: "#/components/parameters/FilterProductId"
        - $ref: "#/components/parameters/FilterBrandLevel"
        - $ref: "#/components/parameters/FilterNotLinked"
        - $ref: "#/components/parameters/FilterCampaignId"
        - $ref: "#/components/parameters/FilterAdGroupId"
        - $ref: "#/components/parameters/FilterAdId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTrend"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------- Development (local only) ----------

  /api/v1/accounts/{accountId}/dev/sample-data:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [Development]
      operationId: createSampleData
      summary: Fill the seller account with sample campaigns, spend and Attribution numbers (local only)
      description: |
        Replaces the account's campaigns, ad groups, ads, daily spend and Attribution numbers with about 90 days of
        made-up but realistic data for its products, so reports can be built and tried before the Google and Amazon
        connections exist. An account without products first gets sample brands and products.
        Includes the cases reports must handle: ads linked to products, a Brand Store ad (brand-level spend), an
        unmatched ad and an Attribution line that matches no ad. Owner only. Only on local development servers.
      responses:
        "200":
          description: Sample data created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleDataResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: false
      description: First day, e.g. 2026-09-25
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: false
      description: Last day, e.g. 2026-10-24
      schema:
        type: string
        format: date
    FilterBrandId:
      name: brandId
      in: query
      required: false
      description: "Only ads of this brand: Brand Store ads and the ads of its products"
      schema:
        type: string
        format: uuid
    FilterProductId:
      name: productId
      in: query
      required: false
      description: Only ads of this product
      schema:
        type: string
        format: uuid
    FilterBrandLevel:
      name: brandLevel
      in: query
      required: false
      description: With brandId, only the brand's Brand Store ads (no single product)
      schema:
        type: boolean
    FilterNotLinked:
      name: notLinked
      in: query
      required: false
      description: Only ads linked to no product and no brand
      schema:
        type: boolean
    FilterCampaignId:
      name: campaignId
      in: query
      required: false
      description: Only ads of this campaign
      schema:
        type: string
        format: uuid
    FilterAdGroupId:
      name: adGroupId
      in: query
      required: false
      description: Only ads of this ad group
      schema:
        type: string
        format: uuid
    FilterAdId:
      name: adId
      in: query
      required: false
      description: Only this ad
      schema:
        type: string
        format: uuid
    RefreshCookieParam:
      name: amazfy_refresh
      in: cookie
      required: false
      schema:
        type: string

  headers:
    RefreshCookie:
      description: "amazfy_refresh=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth (cleared on logout)"
      schema:
        type: string

  responses:
    ValidationError:
      description: The request is invalid; `detail` and `errors` explain what to fix
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Logged in, but no access to this account or not allowed for this role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such brand or product in this account
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Clashes with existing data, e.g. the same ASIN + marketplace already exists, or the brand still has products
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; try again later
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    SystemInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: amazfy-backend
        version:
          type: string
          example: 0.0.1-SNAPSHOT

    Problem:
      description: RFC 7807 problem details
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Password must be at least 10 characters.
        instance:
          type: string
          example: /api/v1/auth/register
        errors:
          description: Field-level validation errors, when there are any
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: password
        message:
          type: string
          example: must be at least 10 characters

    RegisterRequest:
      type: object
      required: [email, password, accountName, region]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: john@aqualife.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        accountName:
          type: string
          minLength: 1
          maxLength: 100
          example: AquaLife Inc. – North America
        region:
          $ref: "#/components/schemas/Region"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 128

    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 200
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 128

    AuthTokens:
      description: The access token; the refresh token is only in the cookie, never in JSON
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          description: Seconds until the access token expires
          type: integer
          example: 900

    Role:
      type: string
      enum: [OWNER, EDITOR, VIEWER]

    Me:
      type: object
      required: [id, email, emailVerified, accounts]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        accounts:
          description: Accounts the user can access, with their role in each. Empty for a new Google user before onboarding.
          type: array
          items:
            $ref: "#/components/schemas/AccountAccess"

    AccountAccess:
      type: object
      required: [account, role]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        role:
          $ref: "#/components/schemas/Role"

    AccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: AquaLife Inc. – North America

    AccountCreateRequest:
      type: object
      required: [name, region]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: AquaLife Inc. – North America
        region:
          $ref: "#/components/schemas/Region"

    Account:
      type: object
      required: [id, name, region, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: AquaLife Inc. – North America
        region:
          $ref: "#/components/schemas/Region"
        createdAt:
          type: string
          format: date-time

    Marketplace:
      description: |
        An Amazon country site. Phase 1 supports the marketplaces where Amazon Attribution is available.
        Codes as Amazon uses them (UK, not GB): US amazon.com, CA amazon.ca, UK amazon.co.uk, DE amazon.de,
        FR amazon.fr, IT amazon.it, ES amazon.es.
      type: string
      enum: [US, CA, UK, DE, FR, IT, ES]

    Region:
      description: |
        The Amazon region of a seller account. Amazon gives one seller account per region ("unified account"),
        and it sells in that region's marketplaces only: NA (North America) US, CA; EU (Europe) UK, DE, FR, IT, ES.
        A product's marketplace must be in its account's region (400 otherwise). Fixed once the account exists.
      type: string
      enum: [NA, EU]

    ReportSummary:
      type: object
      required: [from, to, currencies]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currencies:
          type: array
          description: One entry per currency with spend or sales in the range, sorted by currency code; empty without data
          items:
            $ref: "#/components/schemas/CurrencyTotals"

    CurrencyTotals:
      type: object
      description: |
        Totals in one currency. Money is in the currency's units with 2 decimals (12.50 = $12.50).
        roas, cpa and conversionRate are left out when they can't be calculated (no spend, no purchases, no clicks).
      required: [currency, spend, impressions, clicks, clickThroughs, detailPageViews, addToCarts, purchases, unitsSold, sales]
      properties:
        currency:
          type: string
          description: ISO code, e.g. USD
          example: USD
        spend:
          type: number
          description: What Google charged for the ads
          example: 1250.40
        impressions:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
          description: Clicks counted by Google
        clickThroughs:
          type: integer
          format: int64
          description: Clicks that reached Amazon, counted by Amazon Attribution
        detailPageViews:
          type: integer
          format: int64
        addToCarts:
          type: integer
          format: int64
        purchases:
          type: integer
          format: int64
          description: Orders attributed to the ads (Amazon's 14-day window)
        unitsSold:
          type: integer
          format: int64
        sales:
          type: number
          description: Amazon sales attributed to the ads
          example: 4890.15
        roas:
          type: number
          description: Return on ad spend = sales ÷ spend, e.g. 3.91 (each 1 spent brought 3.91 in sales)
          example: 3.91
        cpa:
          type: number
          description: Cost per acquisition = spend ÷ purchases, in the currency
          example: 9.47
        conversionRate:
          type: number
          description: Purchases ÷ click-throughs × 100, in percent, e.g. 8.2
          example: 8.2

    BreakdownLevel:
      type: string
      enum: [BRAND, PRODUCT, CAMPAIGN, AD_GROUP, AD]

    BreakdownRowKind:
      description: |
        What a row stands for. BRAND, PRODUCT, CAMPAIGN, AD_GROUP, AD: that item (id set).
        BRAND_LEVEL: a brand's Brand Store ads (id = the brand). NOT_LINKED: ads without product or brand.
        UNMATCHED: Attribution numbers that match no known ad.
      type: string
      enum: [BRAND, PRODUCT, BRAND_LEVEL, NOT_LINKED, CAMPAIGN, AD_GROUP, AD, UNMATCHED]

    ReportBreakdown:
      type: object
      required: [from, to, by, rows]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        by:
          $ref: "#/components/schemas/BreakdownLevel"
        rows:
          type: array
          description: Sorted by name; BRAND_LEVEL and NOT_LINKED rows after the others, UNMATCHED last
          items:
            $ref: "#/components/schemas/BreakdownRow"

    BreakdownRow:
      type: object
      required: [kind, name, totals]
      properties:
        kind:
          $ref: "#/components/schemas/BreakdownRowKind"
        id:
          type: string
          format: uuid
          description: The brand, product, campaign, ad group or ad; left out for NOT_LINKED and UNMATCHED
        name:
          type: string
          example: Aquarium filter 40L
        detail:
          type: string
          description: Extra line, e.g. "B0AAA11111 · US" for a product, the final URL for an ad, the campaign for an ad group
        totals:
          $ref: "#/components/schemas/CurrencyTotals"

    ReportTrend:
      type: object
      required: [from, to, series]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        series:
          type: array
          description: One per currency with spend or sales in the range, sorted by currency code; empty without data
          items:
            $ref: "#/components/schemas/TrendSeries"

    TrendSeries:
      type: object
      required: [currency, days]
      properties:
        currency:
          type: string
          example: USD
        days:
          type: array
          description: Every day from..to in order
          items:
            $ref: "#/components/schemas/TrendDay"

    TrendDay:
      type: object
      required: [date, totals]
      properties:
        date:
          type: string
          format: date
        totals:
          $ref: "#/components/schemas/CurrencyTotals"

    SampleDataResult:
      type: object
      description: What the sample data contains
      required: [fromDate, toDate, products, campaigns, ads, spendRows, attributionRows]
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        products:
          type: integer
          description: Products the data was made for
        campaigns:
          type: integer
        ads:
          type: integer
        spendRows:
          type: integer
          description: Rows of daily spend (one per ad and day)
        attributionRows:
          type: integer
          description: Rows of daily Attribution numbers

    BrandRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the account, ignoring upper/lower case
          example: AquaLife

    Brand:
      type: object
      required: [id, name, productCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: AquaLife
        productCount:
          type: integer
          description: How many products the brand has (a brand with products can't be removed)
        createdAt:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [brandId, asin, marketplace, name]
      properties:
        brandId:
          type: string
          format: uuid
        asin:
          type: string
          maxLength: 20
          description: |
            Amazon's 10-character product id, e.g. B0AAA11111 (from the listing's address: amazon.com/dp/B0AAA11111).
            Spaces are trimmed and letters upper-cased; then it must be "B0" plus 8 letters or digits.
            Unique together with the marketplace within the account (409 otherwise).
            The marketplace must be in the account's region (400 otherwise).
          example: B0AAA11111
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A short name the seller recognises, e.g. "Aquarium filter 40L"
          example: Aquarium filter 40L

    ProductUpdateRequest:
      type: object
      description: Only the fields that are sent change
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200

    Product:
      type: object
      required: [id, brandId, asin, marketplace, name, amazonUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        asin:
          type: string
          example: B0AAA11111
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        name:
          type: string
          example: Aquarium filter 40L
        amazonUrl:
          type: string
          format: uri
          description: The listing on Amazon, e.g. https://www.amazon.com/dp/B0AAA11111
        createdAt:
          type: string
          format: date-time
