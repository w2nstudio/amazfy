# Local development defaults (used when no profile is set). Match docker-compose.yml and the Vite dev server.
DB_URL=jdbc:postgresql://localhost:5432/amazfy
DB_USERNAME=amazfy
DB_PASSWORD=amazfy
CORS_ALLOWED_ORIGINS=http://localhost:5173

# More detail while developing
management.endpoint.health.show-details=always
logging.level.com.amazfy=DEBUG

# Local-only signing key. Real environments set JWT_SECRET from a secrets manager.
JWT_SECRET=local-development-secret-not-for-production-0123456789

# Mailpit from docker-compose.yml: no login needed; read sent emails at http://localhost:8025
MAIL_HOST=localhost
MAIL_PORT=1025
MAIL_FROM=Amazfy <no-reply@amazfy.local>
FRONTEND_BASE_URL=http://localhost:5173
