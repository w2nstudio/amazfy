# Production. DB_URL, DB_USERNAME, DB_PASSWORD and CORS_ALLOWED_ORIGINS must be set as environment variables
# (from the hosting platform's secrets); the app refuses to start without them.

# One JSON object per log line, so log tools can search and filter by field
logging.structured.format.console=ecs
logging.level.root=INFO

# Finish in-flight requests before shutting down during deployments
server.shutdown=graceful
