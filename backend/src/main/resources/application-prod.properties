# Production. DB_URL, DB_USERNAME, DB_PASSWORD, CORS_ALLOWED_ORIGINS, JWT_SECRET, MAIL_HOST, MAIL_PORT, MAIL_FROM and
# FRONTEND_BASE_URL must be set as environment variables (from the hosting platform's secrets); the app refuses to
# start without them. MAIL_USERNAME and MAIL_PASSWORD too when the SMTP server needs a login.

# One JSON object per log line, so log tools can search and filter by field
logging.structured.format.console=ecs
logging.level.root=INFO

# Finish in-flight requests before shutting down during deployments
server.shutdown=graceful
