spring.application.name=amazfy-backend

# Database: environment variables in real environments; defaults match docker-compose.yml for local development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amazfy}
spring.datasource.username=${DB_USERNAME:amazfy}
spring.datasource.password=${DB_PASSWORD:amazfy}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep database sessions open during web rendering (avoids hidden queries and connection leaks)
spring.jpa.open-in-view=false
