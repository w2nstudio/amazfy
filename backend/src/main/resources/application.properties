# Shared by all environments. Environment-specific values live in application-<profile>.properties.
# Set the profile with SPRING_PROFILES_ACTIVE (e.g. prod). Without it, "local" is used.
spring.application.name=amazfy-backend
spring.profiles.default=local

# Database: always from environment variables (no defaults here, so production can't start with local values)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep database sessions open during web rendering (avoids hidden queries and connection leaks)
spring.jpa.open-in-view=false

# Origins allowed to call the API from a browser (comma-separated)
amazfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Health endpoint: only the overall status, no internal details
management.endpoint.health.show-details=never

# No default in-memory user with a generated password; real login (JWT) arrives in M1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Access tokens (JWT): signing key from the environment (at least 32 bytes); short lifetime
amazfy.jwt.secret=${JWT_SECRET}
amazfy.jwt.access-token-ttl=15m
# Refresh tokens: lifetime, and whether the cookie needs HTTPS (always true outside local development)
amazfy.auth.refresh-token-ttl=30d
amazfy.auth.cookie-secure=true

# Outgoing email (verification and password-reset links): an SMTP server from the environment.
# Local development uses Mailpit; production uses an email-sending service (to be chosen).
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Sender shown to users, and the frontend address that email links point to
amazfy.mail.from=${MAIL_FROM}
amazfy.mail.frontend-base-url=${FRONTEND_BASE_URL}
# Keep the email server out of /actuator/health: an email outage must not mark the backend unhealthy (and get it restarted)
management.health.mail.enabled=false
