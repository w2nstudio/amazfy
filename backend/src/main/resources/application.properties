# Shared by all environments. Environment-specific values live in application-<profile>.properties.
# Set the profile with SPRING_PROFILES_ACTIVE (e.g. prod). Without it, "local" is used.
spring.application.name=amazfy-backend
spring.profiles.default=local

# JSON answers leave out fields without a value instead of sending null (api/openapi.yaml marks them optional)
spring.jackson.default-property-inclusion=non_null

# Database: always from environment variables (no defaults here, so production can't start with local values)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
# Don't keep database sessions open during web rendering (avoids hidden queries and connection leaks)
spring.jpa.open-in-view=false

# Origins allowed to call the API from a browser (comma-separated)
amazfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Health endpoint: only the overall status, no internal details
management.endpoint.health.show-details=never

# No default in-memory user with a generated password; real login (JWT) arrives in M1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Access tokens (JWT): signing key from the environment (at least 32 bytes); short lifetime
amazfy.jwt.secret=${JWT_SECRET}
amazfy.jwt.access-token-ttl=15m
# Refresh tokens: lifetime, and whether the cookie needs HTTPS (always true outside local development)
amazfy.auth.refresh-token-ttl=30d
amazfy.auth.cookie-secure=true
# How long the link in a verification email works
amazfy.auth.email-verification-ttl=24h
# How long the link in a password-reset email works (short: it grants access to the login)
amazfy.auth.password-reset-ttl=1h

# Outgoing email (verification and password-reset links): an SMTP server from the environment.
# Local development uses Mailpit; production uses an email-sending service (to be chosen).
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Sender shown to users, and the frontend address that email links point to
amazfy.mail.from=${MAIL_FROM}
amazfy.mail.frontend-base-url=${FRONTEND_BASE_URL}

# "Sign in with Google" (OpenID Connect). Optional: without a client id, Google login answers 501.
# Setup: docs/guides/google-login-setup.md. The redirect URI must be registered in Google Cloud exactly as written.
amazfy.google.client-id=${GOOGLE_CLIENT_ID:}
amazfy.google.client-secret=${GOOGLE_CLIENT_SECRET:}
amazfy.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
# Google's fixed addresses: where codes are exchanged for ID tokens, and the public keys that sign those tokens
amazfy.google.token-uri=https://oauth2.googleapis.com/token
amazfy.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# Where the browser lands after Google sign-in (login page on errors)
amazfy.frontend-base-url=${FRONTEND_BASE_URL}

# "Connect Google Ads": same OAuth client as Google login, its own redirect address (docs/guides/google-ads-setup.md)
amazfy.google-ads.redirect-uri=${GOOGLE_ADS_REDIRECT_URI:}
# The Google Ads API. Google retires old versions about a year after release, so this needs moving up now and then.
amazfy.google-ads.api-url=https://googleads.googleapis.com/v26

# Key for secrets Amazfy has to read back, such as Google Ads refresh tokens: Base64, 32 bytes (openssl rand -base64 32).
# Losing or changing it means every seller has to connect again.
amazfy.crypto.secret-key=${SECRET_ENCRYPTION_KEY}

# Keep the email server out of /actuator/health: an email outage must not mark the backend unhealthy (and get it restarted)
management.health.mail.enabled=false

# File uploads (Attribution CSV reports): a year of a large seller's report fits well within 20 MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
