# Runs on every pull request and every push to main.
# A pull request can only be merged when this passes (once branch protection is on).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle downloads between runs and validates the wrapper
      - uses: gradle/actions/setup-gradle@v6

      # build = compile + ktlintCheck + tests (Testcontainers uses the runner's Docker)
      - run: ./gradlew build --console=plain

  frontend:
    name: Frontend lint, format and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exact versions from package-lock.json
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check

      # prebuild regenerates the API client from ../api/openapi.yaml, then TypeScript check + production build
      - run: npm run build

  docker:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build only (no push yet): catches a broken Dockerfile in every pull request
      - run: docker build -f backend/Dockerfile -t amazfy-backend:ci .
