# Dependabot opens pull requests for dependency updates (weekly, grouped to limit noise)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Kotlin 2.4 breaks ktlint ("Extensions storage is not registered"): stay on 2.3.x until ktlint supports 2.4,
      # then remove this rule. Kotlin 2.3 patches and all other updates (e.g. Gradle) still come.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.0"]
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Node type definitions must match the Node version we run (22); bump them when Node is upgraded
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
